name: Bug report
description: Report reproducible behavior in AI Terminal Coach on macOS/Zsh
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AI Terminal Coach. Remove API keys, tokens, private paths, repository content, and terminal history before submitting. `aicoach capsule --failed-only` provides a locally generated, redacted starting point, but you should still review it.
  - type: input
    id: version
    attributes:
      label: AI Terminal Coach version
      description: Paste `aicoach --version`, or the commit hash when building from source.
      placeholder: aicoach 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and architecture
      placeholder: macOS 15.x, Apple Silicon
    validations:
      required: true
  - type: dropdown
    id: terminal
    attributes:
      label: Terminal application
      options:
        - Terminal.app
        - iTerm2
        - Warp
        - WezTerm
        - kitty
        - Alacritty
        - Other
    validations:
      required: true
  - type: input
    id: zsh
    attributes:
      label: Zsh version and configuration
      description: Paste `zsh --version` and mention Oh My Zsh, Powerlevel10k, Starship, autosuggestions, or syntax highlighting when used.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Give the smallest safe sequence that reproduces the problem. Never include a real credential.
      placeholder: |
        1. Start a new Zsh session
        2. Type ...
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste the reviewed output of `aicoach support` and optionally a reviewed Session Capsule. The support report omits private paths and terminal content; never paste an API key or full unreviewed logs.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and removed credentials, private paths, and private repository content.
          required: true
